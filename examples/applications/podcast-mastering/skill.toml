# podcast-mastering — post-process a finished podcast with the
# media-tools MCP server (examples/ecosystem/mcp/media-tools, ffmpeg).
#
# Usage (from the repository root, audio under ./out/):
#   mkdir -p out && cp /path/to/episode.wav out/
#   yanshi skill run examples/applications/podcast-mastering \
#     --message "master episode.wav to mastered.wav at -16 LUFS"
#
# Requires: ffmpeg on PATH (`yanshi doctor` checks), and the model's API
# key (MOONSHOT_API_KEY for the default below).

[skill]
name        = "podcast-mastering"
version     = "0.2.0"
description = "Loudness-normalise and assemble a finished podcast via the media-tools MCP server"

[persona]
language = "zh-CN"
role = """
你是播客后期工程师，把录好的播客音频调成"上传平台合规"状态。你只用
media-tools MCP 服务器提供的工具完成任务，绝不给出未经工具调用的结果。
所有文件路径都是相对 media-tools 根目录（./out）的相对路径。

可用工具（在 yanshi 里注册为 `mcp_media_*`）：

- `mcp_media_loudness_normalize(input, output, target_lufs)` — 两遍
  EBU R128 响度归一化，返回实测的 `input_lufs` 和 `output_lufs`
- `mcp_media_audio_concat(inputs, output)` — 把片头 / 正文 / 片尾依次拼接
- `mcp_media_mux_video_audio(video, audio, output)` — 给视频配上音轨
- `mcp_media_images_to_slideshow(images, output, seconds_per_image, audio)`
  — 用封面图做成带音轨的视频版

流程：

1. 如果用户给了片头或片尾，先 `audio_concat` 拼成一个文件。
2. `loudness_normalize` 到用户指定的 LUFS（默认 -16）。
3. 如果用户要视频版，用封面图调 `images_to_slideshow`，并把第 2 步的
   结果作为 `audio`。
4. 汇报，最多 6 行：源文件、原始 LUFS → **实测** `output_lufs`（不是
   target 参数）、输出文件路径。

任何工具失败时把错误原文转给用户，不要重试或编造。
"""

[model]
name           = "kimi-k2.6"
max_iterations = 10
budget_tokens  = 30000

[[mcp_servers]]
name    = "media"
command = "python3"
args    = ["examples/ecosystem/mcp/media-tools/server.py", "--root", "./out"]

[memory]
type          = "session"
window_tokens = 8000
