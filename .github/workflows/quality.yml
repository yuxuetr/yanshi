name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  verify-edition:
    name: verify workspace edition pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo xtask verify-edition
        run: cargo xtask verify-edition

  check-agent-sdk-doc:
    name: check agent SDK doc references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo xtask check-agent-sdk-doc
        run: cargo xtask check-agent-sdk-doc

  check-arch:
    name: check crate-dependency architecture laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo xtask check-arch
        run: cargo xtask check-arch

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Q3.3.3: yanshi-worker-proto's build.rs invokes tonic-build,
      # which shells out to protoc to compile worker.proto (transitively
      # pulled in by the workspace). ubuntu-latest does not preinstall
      # protoc, so install it before clippy compiles the workspace.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check lints
        # R0.4 (2026-07-28): was `--all-targets` only, so feature-gated code
        # that isn't in any crate's default set (e.g. yanshi-rag's `html`
        # feature, which is exactly where the R0.1 invalid-regex panic
        # lived) never got compiled here and clippy's `invalid_regex` lint
        # never saw it. `--all-features` closes that blind spot.
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  redaction-lint:
    # Q5.2: workspace redaction audit. Scans every
    # `yanshi-*/src/**/*.rs` file for `(debug|info|warn|error)!(...)`
    # macro calls that interpolate raw user prompt / response / content /
    # body / params without going through
    # `yanshi_tracing::redaction::redact_text` (for plain strings) or
    # `yanshi_llm::prompt_fingerprint` (for opaque correlation IDs).
    # `trace!` is intentionally exempt because production deployments
    # exclude it. Suppress a known-false-positive with
    # `// allow-redaction-lint: <reason>` on the same line.
    name: cargo xtask redaction-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run redaction-lint
        run: cargo xtask redaction-lint

  println-lint:
    # V1.7: production log normalization. Scans yanshi-core/
    # yanshi-nodes/yanshi-nodes-ai for println!/eprintln! used as
    # logging outside test code — those crates route diagnostics through
    # `tracing` instead so nothing pollutes stdout/stderr (including
    # JSON-output CLI modes) by default. Suppress a documented, reviewed
    # exception with `// allow-println-lint: <reason>` on the same line.
    name: cargo xtask println-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run println-lint
        run: cargo xtask println-lint

  check-changelog:
    # P10.18.2 / W5.5: fail when a non-trivial source change vs. the base
    # ref (default origin/main) didn't touch CHANGELOG.md AND no commit
    # body in the branch range carries the `chore(skip-changelog)`
    # opt-out marker. Needs the full history (unlike the other xtask lint
    # jobs above, which only touch the files at HEAD) so the diff against
    # origin/main actually has something to compare — a shallow checkout
    # only fetches the current ref.
    name: cargo xtask check-changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Run check-changelog
        run: cargo xtask check-changelog

  ui-tests:
    # W5.5: yanshi-ui's 6 hand-written *.test.ts(x) suites were
    # previously only tsc-checked (never actually executed) — this job
    # runs them for real via vitest, plus the typecheck they always had.
    # Mirrors ui-e2e.yml's actions/setup-node@v4 pattern.
    name: yanshi-ui typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: yanshi-ui/package-lock.json
      - name: Install dependencies
        working-directory: yanshi-ui
        run: npm ci
      - name: Typecheck
        working-directory: yanshi-ui
        run: npm run typecheck
      - name: Unit tests
        working-directory: yanshi-ui
        run: npm test

  clippy-lib-deny:
    # Q5.1: enforce no `unwrap()` / `expect()` in production library
    # code workspace-wide. Tests / examples / benches / build scripts
    # are intentionally exempt — the `--lib --no-deps` scope skips
    # them. Sites with a documented build-time invariant carry a
    # per-site `#[allow(clippy::expect_used, reason = "...")]`
    # annotation; the lint stays at deny so a regression flips CI red.
    name: cargo clippy --lib (unwrap/expect deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce unwrap/expect deny on production code
        run: |
          cargo clippy --workspace --lib --no-deps -- \
            -A warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used

  proto-validate:
    # Q3.3.3: the `yanshi-worker-proto` build script generates prost
    # message structs from
    # `yanshi-worker-proto/proto/yanshi/scheduler/v1/worker.proto`
    # (the proto + tonic-build moved out of `yanshi-server` in P-A2.3
    # so the gateway crate is no longer the source of truth).
    # This standalone job validates the .proto file syntax with
    # `protoc` so a malformed .proto fails CI with a precise error
    # ("`message X` redeclared at L42") instead of letting the
    # failure surface as an opaque `tonic-build` panic inside the
    # clippy / doctest / examples jobs that compile the workspace.
    name: protoc validate worker.proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate worker.proto syntax
        run: |
          protoc \
            --proto_path=yanshi-worker-proto/proto \
            yanshi-worker-proto/proto/yanshi/scheduler/v1/worker.proto \
            --descriptor_set_out=/dev/null
      - name: Reject hand-written prost drift
        # Belt-and-braces: the Rust path consumes the .proto via
        # `tonic::include_proto!` in `yanshi-worker-proto/src/lib.rs`.
        # If a future PR replaces it with a hand-written
        # `pub mod pb { ... }` block again, fail loudly here so the
        # audit-found drift cannot silently reappear.
        run: |
          if ! grep -q 'tonic::include_proto!("yanshi.scheduler.v1")' \
               yanshi-worker-proto/src/lib.rs; then
            echo "::error::Q3.3.3: yanshi-worker-proto/src/lib.rs must use" \
                 "tonic::include_proto! so worker.proto stays the source of truth"
            exit 1
          fi

  cargo-audit:
    # V4.3 (2026-08-08): supply-chain hygiene — cargo-audit was not
    # installed anywhere in CI before this, so known RUSTSEC CVEs in
    # Cargo.lock went unverified indefinitely. Fails on any advisory not
    # explicitly listed in `.cargo/audit.toml`'s ignore list (see that
    # file's header comment for the rationale behind each currently
    # ignored entry, and why a blanket dependency-version bump was tried
    # and discarded in favor of individually-verified targeted updates).
    name: cargo audit (known CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  linux-sandbox-check:
    # P7.4-FU1: the Linux seccomp backend in yanshi-tools/src/sandbox/linux.rs
    # is `#[cfg(target_os = "linux")]`-gated, so macOS dev builds skip it. This
    # dedicated check pins a quick cargo-check pass on the Linux target so a
    # PR that re-introduces a Linux-only compile error fails fast (~2 min)
    # instead of waiting for the release-time docker image build.
    name: cargo check linux sandbox backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: cargo check linux sandbox backend
        run: cargo check --target x86_64-unknown-linux-gnu -p yanshi-tools --all-targets

  test:
    name: cargo test (${{ matrix.package }})
    runs-on: ubuntu-latest
    # R0.3 (2026-07-28): a postgres service for the whole job (not just a
    # dedicated e2e workflow) so yanshi-db / yanshi-server's DB-backed
    # tests — which self-skip with an eprintln when
    # YANSHI_DATABASE_TEST_URL is unset — actually run here instead of
    # silently no-op'ing. Mirrors ui-e2e.yml's service block. Harmless for
    # the matrix legs that don't touch a database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yanshi
          POSTGRES_PASSWORD: yanshi
          POSTGRES_DB: yanshi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yanshi -d yanshi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      YANSHI_DATABASE_TEST_URL: postgres://yanshi:yanshi@localhost:5432/yanshi
    strategy:
      fail-fast: false
      matrix:
        package:
          - yanshi-core
          - yanshi-tools
          - yanshi-mcp
          - yanshi-memory
          - yanshi-skills
          - yanshi-agents
          - yanshi-cli
          - yanshi-llm
          # R0.3 (2026-07-28): the remaining 15 workspace members this
          # matrix never covered — `cargo test` for these crates had never
          # run in CI. Found via an independent engineering-readiness audit
          # after an yanshi-rag regression (an HTML-loader regex that
          # panicked on every call, see the R0.1 fix) shipped invisibly
          # because this job never touched the crate. `xtask test-gate`
          # looked like the ready-made fix but turned out to be a wall-clock
          # performance gate that deliberately ignores test failures
          # (`capture_test_timings` records the elapsed time even when
          # `output.status.success()` is false) — expanding this matrix is
          # the actual correctness gate.
          - yanshi-value
          - yanshi-graph
          - yanshi-store-spi
          - yanshi-agent-spi
          - yanshi-async-util
          - yanshi-nodes
          - yanshi-nodes-ai
          - yanshi-config
          - yanshi-rag
          - yanshi-tracing
          - yanshi-db
          - yanshi-server
          - yanshi-worker
          - yanshi-worker-proto
          - yanshi-harness
          # Eval 2026-10-07: never in the matrix until now.
          - yanshi-tool
          - yanshi-tools-ai
          - xtask
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Q3.3.3 / R0.3: yanshi-worker-proto's build.rs needs protoc to
      # compile worker.proto. yanshi-cli, yanshi-server and
      # yanshi-worker all transitively pull it in too.
      - name: Install protoc
        if: contains(fromJSON('["yanshi-cli","yanshi-server","yanshi-worker","yanshi-worker-proto"]'), matrix.package)
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build yanshi-server for CLI integration tests
        if: matrix.package == 'yanshi-cli'
        # `yanshi serve --check` shells out to the yanshi-server
        # binary. `cargo test -p yanshi-cli` doesn't pull it in, so we
        # build it up front; tests that need it would otherwise fail with
        # an empty-stdout panic instead of running the readiness probe.
        run: cargo build -p yanshi-server
      - name: Require a reachable test database
        # DB-backed tests skip (and pass) when the URL is unset, so a
        # dropped env line or a dead service would turn ~40 tests green
        # without running them. Fail loudly instead.
        if: contains(fromJSON('["yanshi-db","yanshi-server","yanshi-cli"]'), matrix.package)
        run: |
          test -n "$YANSHI_DATABASE_TEST_URL" || { echo "::error::YANSHI_DATABASE_TEST_URL is unset"; exit 1; }
          psql "$YANSHI_DATABASE_TEST_URL" -c 'SELECT 1' >/dev/null
      - name: Run package tests
        # R0.3: yanshi-rag's default features (just `qdrant`) never
        # compile sources/html.rs, which is exactly how the R0.1 regex
        # panic went uncaught — opt into pdf/html/code-chunking too
        # (local-embeddings excluded: it pulls the `ort` crate, which
        # downloads ONNX Runtime binaries at build time, the same reason
        # the `features` job's feature-combo matrix excludes it below).
        # yanshi-nodes-ai's mcp/rag node adapters are similarly
        # feature-gated to nothing by default.
        run: |
          case "${{ matrix.package }}" in
            yanshi-rag)
              cargo test -p yanshi-rag --all-targets --features pdf,html,code-chunking
              ;;
            yanshi-nodes-ai)
              cargo test -p yanshi-nodes-ai --all-targets --features mcp,rag
              ;;
            *)
              cargo test -p ${{ matrix.package }} --all-targets
              ;;
          esac

  doctest:
    name: cargo test docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Q3.3.3: `cargo test --workspace --doc` compiles yanshi-server,
      # whose build.rs needs protoc.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run workspace doc tests
        run: cargo test --workspace --doc

  features:
    name: cargo check features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Existing combinations.
          # W0.7: `core-observability` removed — yanshi-core's
          # `observability` feature was deleted (tracing is now an
          # unconditional dependency; nothing ever enabled the feature).
          - name: mcp-local-transports
            command: cargo check -p yanshi-mcp --features client,server,stdio
          - name: cli-mcp
            command: cargo check -p yanshi-cli --no-default-features --features mcp
          - name: cli-rag
            command: cargo check -p yanshi-cli --no-default-features --features rag
          - name: cli-plugin
            command: cargo check -p yanshi-cli --no-default-features --features plugin
          - name: core-plugin
            command: cargo check -p yanshi-core --features plugin --all-targets
          # P3.9 expansion (working combinations as of v0.3.0):
          - name: cli-no-default
            command: cargo check -p yanshi-cli --no-default-features
          - name: cli-mcp-rag-plugin
            command: cargo check -p yanshi-cli --no-default-features --features mcp,rag,plugin
          - name: cli-all-features
            command: cargo check -p yanshi-cli --all-features
          # P-A2.4 — the extracted workflow-assembly crate's own feature gating.
          - name: config-default
            command: cargo check -p yanshi-config --all-targets
          - name: config-all-features
            command: cargo check -p yanshi-config --features mcp,rag,plugin --all-targets
          # W4.4: the `postgres` feature (a dead flag gating an
          # unreferenced `sqlx` dep — no code in the crate ever consumed
          # it) was removed. `otlp-http` is the crate's first real
          # optional feature; check it compiles on its own matrix leg
          # since it pulls in the opentelemetry dependency chain.
          - name: tracing-otlp-http
            command: cargo check -p yanshi-tracing --features otlp-http --all-targets
          - name: mcp-all-transports
            command: cargo check -p yanshi-mcp --features client,server,stdio,http
          - name: nodes-default
            command: cargo check -p yanshi-nodes
          # M.7 fixes — these previously failed and are now wired in:
          - name: llm-openai-only
            command: cargo check -p yanshi-llm --no-default-features --features openai
          - name: nodes-batch-conditional
            command: cargo check -p yanshi-nodes --features batch,conditional
          # P3.9 close-out — yanshi-rag feature surface. The crate ships
          # four independent feature flags (qdrant default, plus
          # local-embeddings / pdf / html). Each one pulls a different
          # heavy dep tree, so breakage tends to be flag-specific.
          - name: rag-no-default
            command: cargo check -p yanshi-rag --no-default-features
          - name: rag-pdf
            command: cargo check -p yanshi-rag --no-default-features --features pdf
          - name: rag-html
            command: cargo check -p yanshi-rag --no-default-features --features html
          # local-embeddings is intentionally NOT in the matrix: it
          # pulls `ort`, which downloads ONNX Runtime binaries at build
          # time. CI on a clean network would work but is fragile, and
          # the operator-facing flag is already exercised by the rag
          # eval CI job downstream. Track as a manual-validation flag.
          - name: rag-pdf-html
            command: cargo check -p yanshi-rag --no-default-features --features pdf,html
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check feature combination
        run: ${{ matrix.command }}

  rag-eval-smoke:
    name: rag eval schema + baseline regression
    runs-on: ubuntu-latest
    # P10.6.2: dense + hybrid baselines require live OpenAI
    # embeddings, so they self-skip when OPENAI_API_KEY isn't set
    # as a repo secret. Forks without the secret stay green; the
    # main repo's PRs get full retriever-regression coverage when
    # the secret is available on the runner. The `secrets` context
    # cannot be referenced from a step-level `if:` expression
    # (GitHub Actions rejects it as "Unrecognized named-value"), so
    # the secret is promoted to a job-level env var here and the
    # step `if:` then gates on `env.OPENAI_API_KEY` — job-level env
    # is materialized before any step `if:` evaluation.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Q3.3.3 follow-up: `yanshi-cli --features rag` transitively
      # depends on `yanshi-worker-proto`, whose `build.rs` shells out
      # to protoc to compile `worker.proto`. ubuntu-latest does not
      # preinstall protoc, so install it before any `cargo` invocation
      # below tries to build the workspace.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run RAG eval CI fixture (BM25, schema gate)
        run: cargo test -p yanshi-cli --features rag --test rag_eval_cli_tests
      - name: Run RAG eval gate-logic unit tests
        run: cargo test -p yanshi-cli --features rag --bin yanshi commands::rag::eval
      - name: Run RAG eval against checked-in BM25 baseline
        run: |
          cargo run -p yanshi-cli --features rag --bin yanshi -- \
            rag eval \
              --dataset yanshi-rag/eval_datasets/ci_offline \
              --compare-baseline yanshi-rag/eval_baselines/ci_offline/bm25.json
      - name: Run RAG eval against checked-in dense baseline
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          cargo run -p yanshi-cli --features rag --bin yanshi -- \
            rag eval \
              --dataset yanshi-rag/eval_datasets/ci_offline \
              --retriever dense \
              --embedding-model text-embedding-3-small \
              --compare-baseline yanshi-rag/eval_baselines/ci_offline/dense.json
      - name: Run RAG eval against checked-in hybrid baseline
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          cargo run -p yanshi-cli --features rag --bin yanshi -- \
            rag eval \
              --dataset yanshi-rag/eval_datasets/ci_offline \
              --retriever hybrid \
              --embedding-model text-embedding-3-small \
              --compare-baseline yanshi-rag/eval_baselines/ci_offline/hybrid.json

  agent-eval-smoke:
    name: agent eval schema + baseline regression
    runs-on: ubuntu-latest
    # T2.1: mirrors rag-eval-smoke's shape for `yanshi-agents/src/eval`
    # (dataset/assertion/runner/pricing + T2.1's baseline module), which
    # had a complete framework but no CI job exercising it. Uses the
    # mock LLM provider only — no API key, no network, no DB — so it
    # always runs, on forks included.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # yanshi-cli transitively depends on yanshi-worker-proto,
      # whose build.rs shells out to protoc.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run agent eval CI fixture + baseline-gate tests
        run: cargo test -p yanshi-cli --test eval_cli_tests
      - name: Run agent eval baseline-comparison unit tests
        run: cargo test -p yanshi-agents --lib eval::baseline
      - name: Run agent eval against checked-in ci_offline baseline
        env:
          # Registers the two mock model ids the `ci_offline` fixture's
          # cases.jsonl references. Keep in sync with
          # `yanshi-cli/tests/eval_cli_tests.rs::write_eval_mock_models_config`.
          YANSHI_MODELS_CONFIG: /tmp/agent-eval-smoke-models.yml
          # Keep in sync with `eval_cli_tests.rs::mock_responses()` — the
          # checked-in baseline was generated against this exact sequence.
          YANSHI_MOCK_RESPONSES: '["{\"thought\":\"answer directly\",\"answer\":\"hello there\"}", "{\"thought\":\"answer directly\",\"answer\":\"done\"}"]'
        run: |
          cat > /tmp/agent-eval-smoke-models.yml <<'EOF'
          models:
            mock-eval-hello:
              vendor: mock
              type: text
              model_id: mock-eval-hello
            mock-eval-budget:
              vendor: mock
              type: text
              model_id: mock-eval-budget
          providers:
            mock:
              api_key_env: MOCK_API_KEY
          EOF
          cargo run -p yanshi-cli --bin yanshi -- \
            eval run yanshi-agents/eval_datasets/ci_offline \
              --compare-baseline yanshi-agents/eval_baselines/ci_offline/baseline.json

  examples:
    name: examples compile and smoke
    runs-on: ubuntu-latest
    # 10 min ceiling so a regression in any one example can't drag the
    # whole CI run. The xtask runner enforces a per-example cap on top
    # (P3.10 spec target is 5 min total wall clock for the smoke job).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Q3.3.3: workspace examples + smoke tests transitively compile
      # yanshi-server, whose build.rs needs protoc.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile workspace examples
        run: cargo test --workspace --examples
      - name: Validate every example workflow
        # `mcp` is opt-in on the CLI; without it the mcp_* examples fail
        # on node type alone and hide real schema errors underneath.
        run: |
          cargo build -p yanshi-cli --features mcp
          status=0
          for f in yanshi-cli/examples/*.yml yanshi-cli/examples/workflows/*.yml; do
            target/debug/yanshi workflow validate "$f" || { echo "::error file=$f::workflow validate failed"; status=1; }
          done
          exit $status
      - name: Run examples-smoke (xtask)
        run: cargo xtask examples-smoke
      - name: Run no-API example smoke tests
        run: |
          cargo run -p yanshi-core --example fixed_dag_workflow
          cargo run -p yanshi-agents --example agent_native_react
          cargo run -p yanshi-agents --example plan_execute_agent
          cargo run -p yanshi-cli -- workflow run yanshi-cli/examples/workflows/fixed_dag_basic.yml --dry-run
          cargo run -p yanshi-cli -- workflow run yanshi-cli/examples/workflows/skill_agent_hybrid.yml --dry-run
          cargo run -p yanshi-cli --features rag -- workflow run yanshi-cli/examples/workflows/rag_skill_assistant.yml --dry-run
          cargo run -p yanshi-cli -- skill index validate yanshi-skills/examples/skills.index.toml
          cargo run -p yanshi-cli -- skill index list yanshi-skills/examples/skills.index.toml
          cargo run -p yanshi-cli -- skill index resolve yanshi-skills/examples/skills.index.toml mcp-demo
          cargo run -p yanshi-cli -- skill validate yanshi-skills/examples/skills/mcp-basic
          cargo run -p yanshi-cli -- skill list-tools yanshi-skills/examples/skills/mcp-basic
          cargo run -p yanshi-skills --example skill_calls_mcp_tool
          cargo run -p yanshi-agents --example hybrid_workflow_agent
          cargo build -p yanshi-core --features plugin --bin yanshi-echo-plugin
          cargo run -p yanshi-core --features plugin --example plugin_host_demo
          cargo test -p yanshi-cli --features plugin --test workflow_tests plugin_node_tests
          cargo test -p yanshi-cli --features plugin --test marketplace_cli_tests marketplace_install_plugin_package_from_verified_cache

  release-gate:
    name: release gate
    runs-on: ubuntu-latest
    needs:
      - fmt
      - verify-edition
      - check-agent-sdk-doc
      - check-arch
      - clippy
      - clippy-lib-deny
      - redaction-lint
      - println-lint
      - check-changelog
      - ui-tests
      - cargo-audit
      - linux-sandbox-check
      - proto-validate
      - test
      - doctest
      - features
      - examples
      - rag-eval-smoke
      - agent-eval-smoke
    if: ${{ always() }}
    steps:
      - name: Summarize required gates
        run: |
          echo "fmt: ${{ needs.fmt.result }}"
          echo "verify-edition: ${{ needs.verify-edition.result }}"
          echo "check-agent-sdk-doc: ${{ needs.check-agent-sdk-doc.result }}"
          echo "check-arch: ${{ needs.check-arch.result }}"
          echo "clippy: ${{ needs.clippy.result }}"
          echo "clippy-lib-deny: ${{ needs.clippy-lib-deny.result }}"
          echo "redaction-lint: ${{ needs.redaction-lint.result }}"
          echo "println-lint: ${{ needs.println-lint.result }}"
          echo "check-changelog: ${{ needs.check-changelog.result }}"
          echo "ui-tests: ${{ needs.ui-tests.result }}"
          echo "cargo-audit: ${{ needs.cargo-audit.result }}"
          echo "linux-sandbox-check: ${{ needs.linux-sandbox-check.result }}"
          echo "proto-validate: ${{ needs.proto-validate.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "doctest: ${{ needs.doctest.result }}"
          echo "features: ${{ needs.features.result }}"
          echo "examples: ${{ needs.examples.result }}"
          echo "rag-eval-smoke: ${{ needs.rag-eval-smoke.result }}"
          echo "agent-eval-smoke: ${{ needs.agent-eval-smoke.result }}"
          test "${{ needs.fmt.result }}" = "success"
          test "${{ needs.verify-edition.result }}" = "success"
          test "${{ needs.check-agent-sdk-doc.result }}" = "success"
          test "${{ needs.check-arch.result }}" = "success"
          test "${{ needs.clippy.result }}" = "success"
          test "${{ needs.clippy-lib-deny.result }}" = "success"
          test "${{ needs.redaction-lint.result }}" = "success"
          test "${{ needs.println-lint.result }}" = "success"
          test "${{ needs.check-changelog.result }}" = "success"
          test "${{ needs.ui-tests.result }}" = "success"
          test "${{ needs.cargo-audit.result }}" = "success"
          test "${{ needs.linux-sandbox-check.result }}" = "success"
          test "${{ needs.proto-validate.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.doctest.result }}" = "success"
          test "${{ needs.features.result }}" = "success"
          test "${{ needs.examples.result }}" = "success"
          test "${{ needs.rag-eval-smoke.result }}" = "success"
          test "${{ needs.agent-eval-smoke.result }}" = "success"
