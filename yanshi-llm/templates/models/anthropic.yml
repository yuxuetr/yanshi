# Anthropic Claude. Thinking takes two shapes, chosen by model name in
# `providers/anthropic.rs`: Haiku 4.5 uses `budget_tokens`; every other
# entry uses adaptive thinking plus `output_config.effort` (`budget_tokens`
# is a 400 on 4.7 and later). Opus 4.7+, Sonnet 5+, Haiku 5.5 and Fable
# reject non-default sampling parameters, so their `temperature` is null.
models:
  claude-fable-5-1:
    vendor: anthropic
    type: chat
    accepts: [text, image, document]
    model_id: null
    base_url: null
    temperature: null
    top_p: null
    max_tokens: 8192
    frequency_penalty: null
    stop: null
