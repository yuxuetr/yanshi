apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yanshi.fullname" . }}
  labels:
    {{- include "yanshi.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "yanshi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yanshi.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "yanshi.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: yanshi
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            # U1.2: explicit ahead of the generic .Values.env range below
            # so it's always present regardless of what operators set
            # there, and shows up first in `kubectl describe pod`.
            - name: YANSHI_SECURITY_PROFILE
              value: {{ .Values.securityProfile | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "yanshi.fullname" .) .Values.existingSecret }}
                  key: DATABASE_URL
            {{- if or .Values.secretEnv.YANSHI_API_TOKEN .Values.existingSecret }}
            # V3.1: conditional (unlike DATABASE_URL above, which is
            # always structurally required) — rendered only when a
            # token source is actually configured, so a chart install
            # that hasn't set one yet, or is transitioning off no-auth,
            # doesn't reference a secret key that doesn't exist.
            - name: YANSHI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "yanshi.fullname" .) .Values.existingSecret }}
                  key: YANSHI_API_TOKEN
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: scratch
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.scratch.sizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.scratch.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
